<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Background -->
    <rect id="bg" width="512" height="512" rx="115" fill="#000000"/>
    
    <!-- Instagram/Splash Match Gradient -->
    <linearGradient id="instaStory" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f09433"/>
      <stop offset="30%" stop-color="#e6683c"/>
      <stop offset="60%" stop-color="#dc2743"/>
      <stop offset="85%" stop-color="#cc2366"/>
      <stop offset="100%" stop-color="#bc1888"/>
    </linearGradient>

    <!-- Circular Clip Path For Meher DP -->
    <clipPath id="circleClip">
      <circle cx="256" cy="256" r="162" />
    </clipPath>
  </defs>

  <!-- OLED Dark Base -->
  <use href="#bg" />

  <!-- Outer Gradient Story Ring -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="url(#instaStory)" stroke-width="8" />

  <!-- Gap between ring and photo -->
  <circle cx="256" cy="256" r="168" fill="#000000" />

  <!-- Meher Real Photo (Auto Embedded from Repo) -->
  <image href="dp.jpg.jpeg" x="94" y="94" width="324" height="324" preserveAspectRatio="xMidYMid slice" clip-path="url(#circleClip)" />

  <!-- Addictive Unread Notification Badge (Top-Right) -->
  <g transform="translate(372, 105)">
    <!-- Red Outer Ring & Glow -->
    <circle cx="0" cy="0" r="32" fill="#000000" />
    <circle cx="0" cy="0" r="26" fill="#ff2d55" />
    <!-- Number 1 -->
    <text x="0" y="9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="900" fill="#ffffff" text-anchor="middle">1</text>
  </g>
</svg>
